<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Money Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="splash-screen">

        <div class="sparkle sparkle-one">✦</div>
        <div class="sparkle sparkle-two">✧</div>

        <div class="logo-area">

        <img
            src="assets/cat%20logo.png"
            alt="Money Tracker Logo"
            class="logo cat-logo"

            <h1>Welcome to Money Tracker!</h1>

            <p>Plan today,<br>
            for a happier tomorrow♡</p>

   </div>

        </div>

        <div class="loading-line">
            <span></span>
        </div>

    </main>

    <!-- =========================
         AUTH PAGE
    ========================== -->

    <main class="auth-page" id="authPage">

        <div class="auth-decoration sparkle auth-sparkle-one">✦</div>
        <div class="auth-decoration sparkle auth-sparkle-two">✧</div>

        <section class="auth-card">

            <!-- Small Logo -->

            <img
                src="assets/logo%20cat.png"
                alt="Money Tracker"
                class="auth-logo"
            >


            <!-- Heading -->

            <div class="auth-heading">

                <h1 id="authTitle">Welcome back!</h1>

                <p id="authSubtitle">
                    Let's keep your money journey organized ♡
                </p>

            </div>


            <!-- Login / Create Account Toggle -->

            <div class="auth-tabs">

                <button
                    class="auth-tab active"
                    id="loginTab"
                    onclick="showLogin()"
                >
                    Login
                </button>

                <button
                    class="auth-tab"
                    id="registerTab"
                    onclick="showRegister()"
                >
                    Create Account
                </button>

            </div>


            <!-- =========================
                 LOGIN FORM
            ========================== -->

            <form
                class="auth-form"
                id="loginForm"
                onsubmit="handleLogin(event)"
            >

                <div class="input-group">

                    <label for="loginEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="your@email.com"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="forgot-password">
                    <button type="button">
                        Forgot password?
                    </button>
                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Login ♡
                </button>

            </form>


            <!-- =========================
                 REGISTER FORM
            ========================== -->

            <form
                class="auth-form hidden"
                id="registerForm"
                onsubmit="handleRegister(event)"
            >

                <div class="input-group">

                    <label for="registerName">
                        Your Name
                    </label>

                    <input
                        type="text"
                        id="registerName"
                        placeholder="What should we call you?"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="registerEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="your@email.com"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Enter your password again"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Create Account ♡
                </button>

            </form>


            <!-- Bottom Text -->

            <p class="auth-footer" id="authFooter">

                New here?
                <button
                    type="button"
                    onclick="showRegister()"
                >
                    Create an account
                </button>

            </p>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
